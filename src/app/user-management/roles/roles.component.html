<div class="row">
    <div class="col-md-12 pl-md-0 pr-md-0">
        <div class="card card-user">
            <div class="card-body pb-4">
                <!-- <h4 class="sectionHeading">New Role:</h4> -->
                <div class="sectionHeading">
                    <h6 class="fw-bold text-primary mt-2">{{'New Role'| translate}}</h6>
                </div>
                <form [formGroup]="form" (ngSubmit)="onSubmit()">
                    <input type="hidden" formControlName="Id" />
                    <div class="row">
                        <div class="col-12 col-md-6 col-sm-6 col-lg-6 col-xl-4">
                            <div class="form-group">
                                <label for="RoleName" class="form-label">{{'Role Name'| translate}} <span
                                        class="colorRed">*</span></label>
                                <input type="text" class="form-control" formControlName="RoleName"
                                    [ngClass]="{ 'is-invalid': submitted && f['RoleName'].errors }">
                                <div *ngIf="submitted && f['RoleName'].errors" class="invalid-feedback">
                                    <div *ngIf="f['RoleName'].errors['required']">
                                        {{'Role Name is required'| translate}}
                                    </div>
                                </div>

                            </div>
                        </div>
                        <div class="col-12 col-md-6 col-sm-6 col-lg-6 col-xl-4">

                            <div class="form-group">
                                <label for="Description" class="form-label">{{'Description'| translate}}<span
                                        class="colorRed">*</span></label>
                                <input type="text" class="form-control" formControlName="Description"
                                    [ngClass]="{ 'is-invalid': submitted && f['Description'].errors }">
                                <div *ngIf="submitted && f['Description'].errors" class="invalid-feedback">
                                    <div *ngIf="f['Description'].errors['required']">
                                        {{'Description is required'|translate}}
                                    </div>
                                </div>

                            </div>
                        </div>
                        <div class="col-12 col-md-6 col-sm-6 col-lg-6 col-xl-4 checkBox">
                            <div class="form-group">
                                <input type="checkbox" formControlName="IsActive">
                                <label for="Description" class="form-label checkboxstyle">{{'Active'| translate}}</label>
                            </div>
                        </div>
                        <div class="d-flex justify-content-end mt-4 mb-4 gap-2">
                            <div class="btn-group btn-design">
                                <button class="btn btn-success" type="submit"><i
                                        class="fa fa-save"></i><span>{{'Add'| translate}}</span></button>
                                <button class="btn btn-danger" type="button" (click)="clearForm()"><i
                                        class="fa fa-times"></i><span>{{'Cancel'| translate}}</span></button>
                            </div>
                        </div>

                    </div>
                </form>
                <!-- <h4 class="sectionHeading">Roles Listing:</h4> -->

                <div class="dataTableDesign table-responsive">
                    <table class="table table-striped" datatable [dtOptions]="dtOptions" [dtTrigger]="dtTrigger">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>{{'Role Name'| translate}}</th>
                                <th>{{'Description'| translate}}</th>
                                <th>{{'Active'| translate}}</th>
                                <th>{{'Action'| translate}}</th>

                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let p of RolesList; let i = index">
                                 <td>{{i+1}}</td>
                                <td>{{p.roleName}}</td>
                                <td>{{p.description}}</td>
                                <td>
                                    <span class="badge" [ngClass]="p.isActive ? 'bg-success' : 'bg-danger'">
                                        {{ p.isActive ? 'Yes' : 'No' }}
                                    </span>
                                </td>
                                <td>
                                    <div class="action-btn">
                                        <span><i class="fa fa-edit tooltipBefore" (click)="Update(p)"></i></span>
                                        <!-- <span><a href="#"><i class="fa fa-trash"></i></a></span>
                                        <span><a href="#" title="add row"><i class="fa fa-plus"></i></a></span> -->
                                    </div>
                                </td>
                            </tr>

                        </tbody>
                    </table>
                    <!-- <pagination-controls (pageChange)="p = $event"></pagination-controls> -->
                </div>
            </div>
        </div>
    </div>
</div>
